<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>ConvertX SVG 轉換</title><style>body{font:16px system-ui;background:#0f172a;color:#f8fafc;max-width:720px;margin:auto;padding:20px}a{color:#7dd3fc}section{background:#1e293b;padding:18px;border-radius:16px;margin:18px 0}input,select,button{font:inherit;padding:10px;margin:8px 0;max-width:100%}button{background:#38bdf8;border:0;border-radius:10px;color:#082f49;font-weight:700}canvas{max-width:100%;background:repeating-conic-gradient(#ddd 0% 25%,#fff 0% 50%) 50%/20px 20px;border-radius:8px}#status{white-space:pre-wrap}</style></head><body><h1>SVG → PNG / JPG / WebP</h1><p><a href="./">← 返回 ConvertX</a>｜純本機處理，無檔案上傳</p><section><label>選擇 SVG <input id="file" type="file" accept=".svg,image/svg+xml"></label><p><label>輸出格式 <select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select></label></p><p><label>縮放倍數 <select id="scale"><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option></select></label></p><button id="convert">轉換並下載</button><p id="status" role="status"></p><canvas id="preview" width="1" height="1"></canvas></section><script>
const $=id=>document.getElementById(id);let lastUrl=null;
function validateSvg(raw){const doc=new DOMParser().parseFromString(raw,'image/svg+xml');if(doc.querySelector('parsererror'))throw Error('SVG XML 格式錯誤');const root=doc.documentElement;if(root.localName!=='svg'||root.namespaceURI!=='http://www.w3.org/2000/svg')throw Error('不是 SVG 文件');const forbidden=new Set(['script','foreignObject','iframe','object','embed','audio','video','animate','animateMotion','animateTransform','set']);for(const el of doc.querySelectorAll('*')){if(forbidden.has(el.localName))throw Error('不支援含腳本、嵌入內容或動畫的 SVG');for(const a of el.attributes){const name=a.name.toLowerCase(),value=a.value.trim();if(name.startsWith('on')||name==='href'||name.endsWith(':href')||/url\s*\(/i.test(value)||/javascript\s*:/i.test(value)||/<!entity/i.test(value))throw Error('SVG 包含外部資源或不安全屬性')}}if(/<!DOCTYPE|<!ENTITY/i.test(raw))throw Error('不支援 DTD 或 ENTITY');return root}
function dimensions(root){const vb=(root.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(Number);const numeric=v=>{if(!v||/%|em|rem|calc\(/i.test(v))return NaN;const m=v.match(/^([\d.]+)(px)?$/);return m?Number(m[1]):NaN};let w=numeric(root.getAttribute('width')),h=numeric(root.getAttribute('height'));if((!w||!h)&&vb.length===4&&vb[2]>0&&vb[3]>0){w=w||vb[2];h=h||vb[3]}if(!(w>0&&h>0))throw Error('需要有效 width/height 或 viewBox');return [w,h]}
$('convert').onclick=async()=>{try{const file=$('file').files[0];if(!file)throw Error('請先選擇 SVG');if(file.size>2e6)throw Error('SVG 超過 2 MB 上限');const raw=await file.text(),root=validateSvg(raw),[w,h]=dimensions(root),scale=Number($('scale').value),width=Math.round(w*scale),height=Math.round(h*scale);if(width>8192||height>8192||width*height>16000000)throw Error('輸出畫素超過安全限制');const xml=new XMLSerializer().serializeToString(root),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml'}));try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Safari 無法解碼此 SVG'));img.src=url});const canvas=$('preview');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');if(!ctx)throw Error('無法取得 Canvas');const format=$('format').value;if(format==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height)}ctx.drawImage(img,0,0,width,height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,format,.92));if(!blob||blob.type!==format)throw Error('瀏覽器不支援此輸出格式');if(lastUrl)URL.revokeObjectURL(lastUrl);lastUrl=URL.createObjectURL(blob);const a=document.createElement('a');a.href=lastUrl;a.download=file.name.replace(/\.svg$/i,'')+'.'+({ 'image/png':'png','image/jpeg':'jpg','image/webp':'webp'}[format]);a.click();$('status').textContent='完成：'+width+' × '+height+'，'+(blob.size/1024).toFixed(1)+' KB'}finally{URL.revokeObjectURL(url)}}catch(e){$('status').textContent='失敗：'+e.message}};
</script></body></html>
