name: Deploy CAD verification preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cad-preview-pages.yml'
      - 'cad-full/**'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: convertx-cad-preview-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: cad-full
      - name: Test and build
        run: npm run build
        working-directory: cad-full
      - name: Assemble verification site and pinned sources
        run: |
          node cad-full/scripts/prepare-preview.mjs
          bash cad-full/scripts/package-preview-sources.sh
          CAD_DIST_DIR=_site/cad-test node cad-full/scripts/generate-offline-sw.mjs
          CAD_DIST_DIR=_site/cad-test CAD_RELEASE=1 node cad-full/scripts/check-dist.mjs
      - name: Commit built preview to existing Pages source branch
        run: |
          rm -rf cad-test cad-source
          cp -R _site/cad-test ./cad-test
          cp -R _site/cad-source ./cad-source
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cad-test cad-source .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "build(cad): publish verification assets for $GITHUB_SHA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
