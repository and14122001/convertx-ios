<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>ConvertX 資料轉換</title><style>body{font:16px system-ui;background:#0f172a;color:white;max-width:720px;margin:auto;padding:20px}a{color:#7dd3fc}section{background:#1e293b;border-radius:14px;padding:16px;margin:16px 0}textarea{width:100%;height:220px;box-sizing:border-box;background:#020617;color:#fff;border:1px solid #64748b;border-radius:8px;padding:12px}select,input,button{font:inherit;margin:6px 0;padding:10px;border-radius:8px}button{background:#38bdf8;border:0;color:#082f49}#status{white-space:pre-wrap}</style><h1>資料格式轉換</h1><p><a href="./">← 返回 ConvertX</a>｜本機離線，無上傳</p><section><input type="file" id="file" accept=".json,.csv,.tsv,.vcf,.txt"><p>來源 <select id="source"><option value="json">JSON</option><option value="csv">CSV</option><option value="tsv">TSV</option><option value="vcf">VCF</option></select> 目標 <select id="target"><option value="csv">CSV</option><option value="json">JSON</option><option value="tsv">TSV</option></select></p><textarea id="data" placeholder="貼上資料或選擇檔案"></textarea><p><button id="convert">轉換並下載</button></p><p id="status" role="status"></p></section><script>
const $=x=>document.getElementById(x);let downloadUrl=null;
$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;if(f.size>5e6){$('status').textContent='檔案超過 5MB 上限';return}const ext=f.name.split('.').pop().toLowerCase();if(['json','csv','tsv','vcf'].includes(ext))$('source').value=ext;$('data').value=await f.text();$('status').textContent='已載入 '+f.name};
function parseDelimited(text,sep){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"'){if(field!=='')throw Error('引號格式錯誤');quoted=true}else if(c===sep){row.push(field);field=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(v=>v!==''))rows.push(row);row=[];field=''}else field+=c}if(quoted)throw Error('引號未閉合');row.push(field);if(row.some(v=>v!==''))rows.push(row);if(!rows.length)return[];const headers=rows.shift();return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])))}
function quote(v,sep){const s=v==null?'':typeof v==='object'?JSON.stringify(v):String(v);return /["\r\n]/.test(s)||s.includes(sep)?'"'+s.replace(/"/g,'""')+'"':s}
function delimited(rows,sep){if(!rows.length)return'';const keys=[...new Set(rows.flatMap(x=>Object.keys(x)))];return [keys.map(k=>quote(k,sep)).join(sep),...rows.map(r=>keys.map(k=>quote(r[k],sep)).join(sep))].join('\r\n')}
function vcf(text){const unfolded=text.replace(/\r?\n[ \t]/g,'');const contacts=[];for(const block of unfolded.split(/BEGIN:VCARD/i).slice(1)){const entry=block.split(/END:VCARD/i)[0],obj={};for(const line of entry.split(/\r?\n/)){const m=line.match(/^([^:]+):(.*)$/);if(!m)continue;const key=m[1].split(';')[0].toUpperCase();if(['FN','N','EMAIL','TEL','ORG','TITLE'].includes(key)){const val=m[2].replace(/\\n/gi,'\n').replace(/\\,/g,',').replace(/\\;/g,';');obj[key]=obj[key]?obj[key]+'; '+val:val}}if(Object.keys(obj).length)contacts.push(obj)}return contacts}
$('convert').onclick=()=>{try{let input=$('data').value;if(!input.trim())throw Error('沒有資料');let rows;switch($('source').value){case'json':{const obj=JSON.parse(input);if(!Array.isArray(obj)||obj.some(x=>!x||typeof x!=='object'||Array.isArray(x)))throw Error('JSON 必須是物件陣列');rows=obj;break}case'csv':rows=parseDelimited(input,',');break;case'tsv':rows=parseDelimited(input,'\t');break;case'vcf':rows=vcf(input);break}let target=$('target').value,output=target==='json'?JSON.stringify(rows,null,2):delimited(rows,target==='tsv'?'\t':',');if(downloadUrl)URL.revokeObjectURL(downloadUrl);downloadUrl=URL.createObjectURL(new Blob(['\uFEFF',output],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=downloadUrl;a.download='convertx-data.'+target;a.click();$('status').textContent='轉換完成：'+rows.length+' 筆。JSON 值轉 CSV 時巢狀物件會序列化為文字。'}catch(e){$('status').textContent='轉換失敗：'+e.message}};</script></html>
