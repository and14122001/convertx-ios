<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>ConvertX CAD 實驗版</title><style>body{background:#0f172a;color:#f8fafc;font:16px system-ui;max-width:800px;margin:auto;padding:18px}a{color:#7dd3fc}section{background:#1e293b;padding:18px;border-radius:14px;margin:15px 0}button,input{font:inherit;padding:12px}button{background:#38bdf8;border:0;border-radius:9px}button:disabled{opacity:.45}svg{background:white;width:100%;height:auto;max-height:65vh}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>CAD DXF → SVG 實驗版</h1><p><a href="./">← 返回 ConvertX</a>｜離線處理｜僅支援 ASCII DXF 的 LINE／CIRCLE／ARC／LWPOLYLINE 子集；DWG 尚未支援。</p><section><input type="file" id="file" accept=".dxf,.dwg"><p id="status" role="status">選擇 DXF 圖檔</p><button id="download" disabled>下載 SVG</button><div id="preview"></div><pre id="details"></pre></section><script>
const $=id=>document.getElementById(id);let svgText='',filename='';
function pairs(text){const lines=text.replace(/^\uFEFF/,'').replace(/\r/g,'').split('\n');const out=[];for(let i=0;i+1<lines.length;i+=2){const code=Number(lines[i].trim());if(!Number.isInteger(code))throw Error('DXF 群組碼無效，可能不是 ASCII DXF');out.push([code,lines[i+1].trim()])}return out}
function parse(text){const p=pairs(text);let section='',inEntities=false,current=null,entities=[];for(let i=0;i<p.length;i++){const [c,v]=p[i];if(c===0&&v==='SECTION'){section=p[i+1]?.[1]=== 'ENTITIES'?'ENTITIES':p[i+1]?.[1]==='HEADER'?'HEADER':'OTHER';inEntities=section==='ENTITIES';continue}if(c===0&&v==='ENDSEC'){if(current)entities.push(current);current=null;inEntities=false;continue}if(!inEntities)continue;if(c===0){if(current)entities.push(current);current={type:v,groups:[]}}else if(current)current.groups.push([c,v])}if(current)entities.push(current);return entities}
function get(g,c,defaultValue=0){const a=g.find(x=>x[0]===c);return a?Number(a[1]):defaultValue}
function points(g){const p=[];let last=null;for(const [c,v] of g){if(c===10){last={x:Number(v),y:NaN,bulge:0};p.push(last)}else if(c===20&&last){last.y=Number(v)}else if(c===42&&last){last.bulge=Number(v)}}return p}
function esc(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function polyPath(pp,closed){let d='M '+pp[0].x+' '+(-pp[0].y);const segments=closed?pp.length:pp.length-1;for(let i=0;i<segments;i++){const a=pp[i],b=pp[(i+1)%pp.length],bulge=a.bulge||0,dx=b.x-a.x,dy=b.y-a.y,chord=Math.hypot(dx,dy);if(Math.abs(bulge)>1e-10&&chord>0){const radius=chord*(1+bulge*bulge)/(4*Math.abs(bulge));d+=' A '+radius+' '+radius+' 0 '+(Math.abs(bulge)>1?1:0)+' '+(bulge>0?0:1)+' '+b.x+' '+(-b.y)}else d+=' L '+b.x+' '+(-b.y)}return d+(closed?' Z':'')}
function render(entities){let shapes=[],bounds=[],counts={},skipped={};const add=(s,coords)=>{if(coords.every(Number.isFinite)){shapes.push(s);for(const v of coords)bounds.push(v)}};
for(const e of entities){counts[e.type]=(counts[e.type]||0)+1;const g=e.groups,layer=esc(g.find(x=>x[0]===8)?.[1]||'0');const n=(code,def=0)=>get(g,code,def);const extrusion=[n(210,0),n(220,0),n(230,1)];if(extrusion.some((v,i)=>Math.abs(v-[0,0,1][i])>1e-9)){skipped[e.type]=(skipped[e.type]||0)+1;continue}if((n(60)!==0||n(67)!==0||n(39)!==0||n(38)!==0||n(30)!==0||n(31)!==0)){skipped[e.type]=(skipped[e.type]||0)+1;continue}if(e.type==='LWPOLYLINE'&&(n(43)!==0||g.some(([code,v])=>(code===40||code===41)&&Number(v)!==0))){skipped[e.type]=(skipped[e.type]||0)+1;continue}if(e.type==='LINE'){const x=n(10),y=n(20),x2=n(11),y2=n(21);s='<line x1="'+x+'" y1="'+(-y)+'" x2="'+x2+'" y2="'+(-y2)+'"/>';add('<g data-layer="'+layer+'">'+s+'</g>',[x,-y,x2,-y2])}else if(e.type==='CIRCLE'){const x=n(10),y=n(20),r=n(40);if(r>0){s='<circle cx="'+x+'" cy="'+(-y)+'" r="'+r+'"/>';add('<g data-layer="'+layer+'">'+s+'</g>',[x-r,-y-r,x+r,-y+r])}}else if(e.type==='LWPOLYLINE'){const pp=points(g);if(pp.length&&pp.every(t=>Number.isFinite(t.x)&&Number.isFinite(t.y)&&Number.isFinite(t.bulge))){const closed=(n(70)&1)!==0;s='<path d="'+polyPath(pp,closed)+'"/>';add('<g data-layer="'+layer+'">'+s+'</g>',pp.flatMap((t,i)=>{const a=[t.x,-t.y];if(Math.abs(t.bulge||0)>1e-10&&(closed||i<pp.length-1)){const q=pp[(i+1)%pp.length],r=Math.hypot(q.x-t.x,q.y-t.y)*(1+t.bulge*t.bulge)/(4*Math.abs(t.bulge));a.push(t.x-r,-t.y-r,t.x+r,-t.y+r,q.x-r,-q.y-r,q.x+r,-q.y+r)}return a}))}}else if(e.type==='ARC'){const x=n(10),y=n(20),r=n(40),a=n(50)*Math.PI/180,b=n(51)*Math.PI/180;if(r>0){let sweep=((n(51)-n(50))%360+360)%360;if(sweep<1e-10){skipped[e.type]=(skipped[e.type]||0)+1;continue}const x1=x+r*Math.cos(a),y1=-y-r*Math.sin(a),x2=x+r*Math.cos(b),y2=-y-r*Math.sin(b);s='<path d="M '+x1+' '+y1+' A '+r+' '+r+' 0 '+(sweep>180?1:0)+' 0 '+x2+' '+y2+'"/>';add('<g data-layer="'+layer+'">'+s+'</g>',[x-r,-y-r,x+r,-y+r])}}else skipped[e.type]=(skipped[e.type]||0)+1}
if(!shapes.length)throw Error('沒有可輸出的 LINE／CIRCLE／ARC／LWPOLYLINE 幾何');const xs=bounds.filter((_,i)=>i%2===0),ys=bounds.filter((_,i)=>i%2===1),minX=Math.min(...xs),minY=Math.min(...ys),maxX=Math.max(...xs),maxY=Math.max(...ys),pad=Math.max(maxX-minX,maxY-minY)*.03||1;const vb=[minX-pad,minY-pad,Math.max(maxX-minX+pad*2,1),Math.max(maxY-minY+pad*2,1)].join(' ');return {svg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+vb+'" fill="none" stroke="#111827" stroke-width="'+Math.max((maxX-minX)/800,.15)+'" vector-effect="non-scaling-stroke">'+shapes.join('')+'</svg>',counts,skipped}}
$('file').onchange=async()=>{const f=$('file').files[0];$('download').disabled=true;svgText='';filename='';$('preview').textContent='';if(!f)return;try{if(f.size>5e6)throw Error('檔案超過 5 MB 上限');if(/\.dwg$/i.test(f.name))throw Error('DWG 是二進位格式，本實驗版尚無 LibreDWG WASM，不會假裝轉檔');if(!/\.dxf$/i.test(f.name))throw Error('請選擇 .dxf');const t=await f.text();if(t.includes('\0'))throw Error('不支援二進位 DXF');const result=render(parse(t));svgText=result.svg;filename=f.name.replace(/\.dxf$/i,'.svg');$('preview').innerHTML=svgText;$('details').textContent='圖元統計：'+JSON.stringify(result.counts)+'\n未輸出圖元：'+JSON.stringify(result.skipped)+'\n注意：僅為幾何子集，非保真 CAD 轉換；不支援 BLOCK/INSERT、TEXT、HATCH、尺寸、線型及 OCS 非預設擠出方向。';$('download').disabled=false;$('status').textContent='SVG 已產生；請檢查缺失圖元後再使用'}catch(e){$('status').textContent='失敗：'+e.message}};
$('download').onclick=()=>{if(!svgText)return;const u=URL.createObjectURL(new Blob([svgText],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></body></html>
