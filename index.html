<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ConvertX"><link rel="manifest" href="./manifest.webmanifest"><title>ConvertX iOS Lite</title><style>body{font-family:-apple-system,system-ui;background:#0f172a;color:white;margin:0;padding:24px;max-width:650px;margin:auto}h1{font-size:28px}label,select,button,input{display:block;margin:15px 0}button,select,input::file-selector-button{border:0;border-radius:12px;padding:13px;background:#38bdf8;color:#082f49;font-weight:700}button{width:100%}input{max-width:100%}.card{background:#1e293b;border-radius:18px;padding:20px;margin-top:18px}small{color:#cbd5e1}a{color:#7dd3fc;display:block;margin:12px 0;overflow-wrap:anywhere}</style></head><body><h1>ConvertX iOS Lite</h1><p>iPhone 本機離線圖片轉換器</p><div class="card"><label>選取圖片（可多選）<input id="files" type="file" accept="image/*" multiple></label><label>輸出格式<select id="format"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></label><label>品質（JPG / WebP）<input id="quality" type="range" min="30" max="100" value="90"></label><button id="go">開始轉換</button><small>所有檔案僅在裝置內處理，不會上傳。HEIC 需 Safari 能解碼。</small></div><div class="card"><strong>轉換結果</strong><div id="results">尚未轉換</div></div><p id="status" role="status"></p><small>加入主畫面：Safari 分享 → 加入主畫面。首次線上載入後可離線使用。</small><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});const files=document.querySelector('#files'),format=document.querySelector('#format'),quality=document.querySelector('#quality'),results=document.querySelector('#results'),status=document.querySelector('#status');document.querySelector('#go').onclick=async()=>{if(!files.files.length){status.textContent='請先選擇圖片';return}results.textContent='';status.textContent='轉換中…';let ok=0;for(const file of files.files){try{const bmp=await createImageBitmap(file);const c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;const ctx=c.getContext('2d');if(format.value==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height)}ctx.drawImage(bmp,0,0);bmp.close();const blob=await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(Error('不支援輸出格式')),format.value,Number(quality.value)/100));const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[format.value];const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name.replace(/\.[^.]+$/,'')+'.'+ext;a.textContent='儲存 '+a.download+' ('+Math.round(blob.size/1024)+' KB)';results.append(a);ok++}catch(e){const p=document.createElement('p');p.textContent=file.name+'：'+e.message;results.append(p)}}status.textContent='完成 '+ok+' / '+files.files.length+' 個檔案。點擊結果儲存至檔案 App。'};</script></body></html>
