<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ConvertX"><link rel="manifest" href="./manifest.webmanifest"><title>ConvertX iOS Lite</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,system-ui;background:#0f172a;color:#f8fafc;margin:0;padding:22px max(16px,env(safe-area-inset-right)) 50px;max-width:740px;margin:auto}h1{font-size:27px;margin:10px 0}p,small{color:#cbd5e1}label{display:block;margin:15px 0 6px;font-size:14px}input,select,button{font:inherit}input[type=file]{width:100%;padding:12px;background:#334155;border-radius:12px}select,input[type=number]{width:100%;padding:12px;border:1px solid #64748b;border-radius:12px;background:#0f172a;color:white}input[type=range]{width:100%}button{border:0;border-radius:12px;padding:14px;background:#38bdf8;color:#082f49;font-weight:700;width:100%;margin-top:15px}button:disabled{opacity:.5}.card{background:#1e293b;border-radius:18px;padding:18px;margin:18px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}a{display:block;color:#7dd3fc;padding:10px 0;overflow-wrap:anywhere}#results article{padding:12px 0;border-bottom:1px solid #475569}#results article:last-child{border:0}.muted{font-size:13px;color:#94a3b8}.error{color:#fca5a5}#preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}#preview img{width:100%;height:90px;object-fit:cover;border-radius:8px}#status{min-height:24px}</style></head><body><h1>ConvertX <span class="muted">iOS Lite v0.2</span></h1><p>本機圖片轉換、縮圖、壓縮、批次處理。檔案不離開手機。</p><section class="card"><label for="files">選擇圖片（可多選）</label><input id="files" type="file" accept="image/*,.heic,.heif" multiple><div id="preview"></div><label for="format">輸出格式</label><select id="format"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select><div class="row"><div><label for="width">最大寬度（0 = 原尺寸）</label><input id="width" type="number" min="0" max="12000" value="0" inputmode="numeric"></div><div><label for="height">最大高度（0 = 原尺寸）</label><input id="height" type="number" min="0" max="12000" value="0" inputmode="numeric"></div></div><label for="quality">輸出品質 <span id="qval">90%</span>（JPG / WebP）</label><input id="quality" type="range" min="30" max="100" value="90"><button id="go">開始批次轉換</button><button id="clear" style="background:#475569;color:white">清除結果</button></section><section class="card"><strong>轉換結果</strong><div id="results" class="muted">尚未轉換</div></section><p id="status" role="status"></p><p class="muted">離線功能：首次透過 HTTPS 載入後，網站程式可由快取啟動。HEIC 解碼與 WebP 輸出取決於 iOS Safari 支援。大量高解析度圖片可能因手機記憶體不足而失敗。</p><script>const $=id=>document.getElementById(id),files=$('files'),results=$('results');let urls=[];if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});$('quality').oninput=()=>{$('qval').textContent=$('quality').value+'%'};function cleanup(){urls.forEach(URL.revokeObjectURL);urls=[];results.textContent='尚未轉換';$('status').textContent=''}$('clear').onclick=cleanup;files.onchange=()=>{const p=$('preview');p.replaceChildren();for(const f of Array.from(files.files).slice(0,9)){const u=URL.createObjectURL(f);const img=document.createElement('img');img.src=u;img.alt=f.name;img.onload=()=>URL.revokeObjectURL(u);img.onerror=()=>URL.revokeObjectURL(u);p.append(img)}};function size(n){return n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB'}function loadImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Safari 無法解碼此格式'))};img.src=url})}async function convert(file){const img=await loadImage(file),mw=Number($('width').value)||Infinity,mh=Number($('height').value)||Infinity;if(mw<0||mh<0)throw Error('尺寸不可為負數');const scale=Math.min(1,mw/img.naturalWidth,mh/img.naturalHeight);const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));if(w*h>40000000)throw Error('圖片像素過大，請先縮小尺寸');const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx)throw Error('無法建立畫布');const type=$('format').value;if(type==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h)}ctx.drawImage(img,0,0,w,h);const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('輸出失敗')),type,Number($('quality').value)/100));canvas.width=canvas.height=0;if(blob.type!==type)throw Error('此裝置不支援輸出格式');return{blob,w,h}}$('go').onclick=async()=>{const selected=Array.from(files.files);if(!selected.length){$('status').textContent='請先選擇圖片';return}cleanup();results.textContent='';$('go').disabled=true;let ok=0;for(let i=0;i<selected.length;i++){const f=selected[i];$('status').textContent='處理中 '+(i+1)+' / '+selected.length;const article=document.createElement('article');try{const{blob,w,h}=await convert(f);const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[$('format').value],name=f.name.replace(/\.[^.]+$/,'')+'.'+ext,url=URL.createObjectURL(blob);urls.push(url);const a=document.createElement('a');a.href=url;a.download=name;a.textContent='下載 '+name;const info=document.createElement('div');info.className='muted';const diff=(100*(blob.size/f.size-1)).toFixed(1);info.textContent=w+' × '+h+' · '+size(f.size)+' → '+size(blob.size)+' ('+(diff>0?'+':'')+diff+'%)';article.append(a,info);ok++}catch(e){article.className='error';article.textContent=f.name+'：'+e.message}results.append(article)}$('status').textContent='完成 '+ok+' / '+selected.length+' 個檔案';$('go').disabled=false};</script></body></html>
